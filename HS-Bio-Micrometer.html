<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세포의 크기 측정 가상 실험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        
        /* 숫자 입력 화살표 숨김 */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<!-- 스크롤 방지, 화면 꽉 채움 (h-[100dvh]를 사용하여 모바일 주소창 대응) -->
<body class="m-0 p-0 w-screen h-[100dvh] overflow-hidden flex flex-col md:flex-row bg-[#0f172a]">

    <!-- 왼쪽(태블릿/모바일에서는 위쪽) 패널: 조작 및 설명 -->
    <div class="w-full md:w-[400px] lg:w-[450px] h-[45dvh] md:h-full bg-white flex flex-col shadow-2xl z-10 border-b md:border-b-0 md:border-r border-gray-300">
        <!-- 내용이 길어지면 이 영역 안에서만 스크롤 됨 -->
        <div class="flex-1 overflow-y-auto p-5 md:p-6 custom-scrollbar">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">🔬 세포 크기 측정</h1>
            <p class="text-gray-600 mb-6 text-xs md:text-sm leading-relaxed">대물 눈금과 접안 눈금이 겹치는 부분을 찾아 1눈금 길이를 구하고, 세포의 크기를 측정해 봅시다.</p>

            <!-- 배율 선택 -->
            <div class="mb-5 md:mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. 대물렌즈 배율 선택</label>
                <div class="flex space-x-2">
                    <button class="mag-btn flex-1 py-2.5 md:py-3 rounded-lg font-bold border-2 transition-colors border-blue-500 bg-blue-50 text-blue-700" data-mag="100">100X</button>
                    <button class="mag-btn flex-1 py-2.5 md:py-3 rounded-lg font-bold border-2 transition-colors border-gray-200 hover:border-blue-300 text-gray-600" data-mag="200">200X</button>
                    <button class="mag-btn flex-1 py-2.5 md:py-3 rounded-lg font-bold border-2 transition-colors border-gray-200 hover:border-blue-300 text-gray-600" data-mag="400">400X</button>
                </div>
                <p class="text-xs text-gray-500 mt-2">* 대물마이크로미터 1눈금의 실제 길이는 10μm</p>
            </div>

            <!-- 단계별 패널 -->
            <div id="panel-step1" class="bg-blue-50 p-4 rounded-xl mb-4 shadow-sm border border-blue-100">
                <h2 class="font-bold text-blue-800 mb-3 text-sm md:text-base">2. 접안 1눈금 길이 계산</h2>
                <div class="space-y-3 text-sm">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-700">겹치는 대물 눈금:</span>
                        <div class="flex items-center"><input type="number" id="input-obj-div" class="w-16 h-8 p-1 text-center font-semibold border border-gray-300 rounded mx-1 focus:ring-2 focus:ring-blue-400 focus:outline-none"> 칸</div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-700">겹치는 접안 눈금:</span>
                        <div class="flex items-center"><input type="number" id="input-ocu-div" class="w-16 h-8 p-1 text-center font-semibold border border-gray-300 rounded mx-1 focus:ring-2 focus:ring-blue-400 focus:outline-none"> 칸</div>
                    </div>
                    <div class="flex items-center justify-between font-bold border-t border-blue-200 pt-3 mt-1 text-blue-900">
                        <span>접안 1눈금 길이:</span>
                        <div class="flex items-center"><input type="number" id="input-ocu-len" step="0.1" class="w-20 h-9 p-1 text-center text-base border-2 border-blue-400 rounded mx-1 focus:ring-2 focus:ring-blue-600 focus:outline-none"> μm</div>
                    </div>
                </div>
                <button id="btn-check-step1" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md transition-all">정답 확인 및 세포 보기</button>
                <p id="msg-step1" class="text-sm text-center mt-3 font-bold hidden"></p>
            </div>

            <div id="panel-step2" class="bg-green-50 p-4 rounded-xl mb-4 hidden border border-green-200 shadow-sm transition-all duration-300">
                <h2 class="font-bold text-green-800 mb-3 text-sm md:text-base">3. 세포 크기 측정</h2>
                <p class="text-sm text-gray-700 mb-3">화면의 세포는 접안 눈금 <span id="cell-div-text" class="font-bold text-green-700 text-base">?</span>칸 크기입니다. 실제 길이는?</p>
                <div class="flex items-center justify-center space-x-2">
                    <input type="number" id="input-cell-size" step="0.1" class="w-24 h-12 p-2 text-center text-xl font-bold border-2 border-green-500 rounded-lg focus:ring-2 focus:ring-green-600 focus:outline-none" placeholder="0.0">
                    <span class="font-bold text-gray-700 text-lg">μm</span>
                </div>
                <button id="btn-check-step2" class="mt-4 w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold py-3 rounded-lg shadow-md transition-all">측정 완료</button>
                <p id="msg-step2" class="text-sm text-center mt-3 font-bold hidden"></p>
                <button id="btn-reset" class="mt-3 w-full bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2 rounded-lg text-sm transition-all hidden">입력값 지우고 다시하기</button>
            </div>
        </div>
    </div>

    <!-- 오른쪽(태블릿/모바일에서는 아래쪽) 캔버스 (현미경 뷰) -->
    <!-- 현미경 주변을 어둡게 처리하여 렌즈에 집중되도록 구성 -->
    <div id="canvas-wrapper" class="flex-1 h-[55dvh] md:h-full relative flex items-center justify-center p-3 md:p-8 bg-gray-900 bg-opacity-95">
        <!-- Javascript로 정사각형(1:1) 비율이 유지되도록 크기 자동 조절됨 -->
        <div id="canvas-container" class="relative rounded-full overflow-hidden bg-[#e0f2fe] shadow-[0_0_50px_rgba(0,0,0,0.8)] border-4 border-gray-800">
            <canvas id="microscope-canvas" class="block w-full h-full"></canvas>
            <!-- 현미경 테두리 그림자 효과 -->
            <div class="absolute inset-0 rounded-full border-[min(20px,3vw)] border-[#111827] pointer-events-none shadow-[inset_0_0_50px_rgba(0,0,0,0.8)]"></div>
        </div>
    </div>

    <script>
        // --- 1. 교사 수정 가능 설정 영역 ---
        const CONFIG = {
            100: { objDiv: 10, ocuDiv: 20, ocuLen: 5.0 },
            200: { objDiv: 10, ocuDiv: 40, ocuLen: 2.5 },
            400: { objDiv: 5,  ocuDiv: 40, ocuLen: 1.25 }
        };
        // ------------------------------------
        
        let currentMag = 100;
        let currentStep = 1; 
        let cellDivisions = 0; 

        // 동적 캔버스 변수
        let sf = 1; // 스케일 팩터 (창 크기에 따른 비율)
        let CENTER_X, CENTER_Y, OCU_SPACING, START_X;

        const canvasWrapper = document.getElementById('canvas-wrapper');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('microscope-canvas');
        const ctx = canvas.getContext('2d');
        const magBtns = document.querySelectorAll('.mag-btn');
        const panelStep2 = document.getElementById('panel-step2');
        const msgStep1 = document.getElementById('msg-step1');
        const msgStep2 = document.getElementById('msg-step2');

        function init() {
            magBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    magBtns.forEach(b => {
                        b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                        b.classList.add('border-gray-200', 'text-gray-600');
                    });
                    const target = e.target;
                    target.classList.remove('border-gray-200', 'text-gray-600');
                    target.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    
                    currentMag = parseInt(target.dataset.mag);
                    
                    // 배율 변경 시 1단계로 리셋
                    currentStep = 1;
                    panelStep2.classList.add('hidden');
                    document.getElementById('input-cell-size').value = '';
                    hideMessage(msgStep2);
                    
                    document.getElementById('btn-reset').classList.add('hidden');
                    document.getElementById('btn-check-step2').classList.remove('hidden');

                    document.getElementById('input-obj-div').value = '';
                    document.getElementById('input-ocu-div').value = '';
                    document.getElementById('input-ocu-len').value = '';
                    hideMessage(msgStep1);
                    
                    drawMicroscope();
                });
            });

            document.getElementById('btn-check-step1').addEventListener('click', checkStep1);
            document.getElementById('btn-check-step2').addEventListener('click', checkStep2);
            document.getElementById('btn-reset').addEventListener('click', () => {
                document.getElementById('input-cell-size').value = '';
                hideMessage(msgStep2);
                document.getElementById('btn-reset').classList.add('hidden');
                document.getElementById('btn-check-step2').classList.remove('hidden');
            });

            // 화면 크기가 변할 때마다 캔버스 자동 리사이징 적용
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); // 최초 1회 실행
        }

        // 반응형으로 캔버스 크기와 비율을 다시 계산하는 함수
        function resizeCanvas() {
            // 영역의 가로, 세로 중 짧은 쪽을 구해 꽉 차는 정사각형 크기 계산
            const rect = canvasWrapper.getBoundingClientRect();
            const padding = 20; // 최소 여백
            const size = Math.min(rect.width - padding*2, rect.height - padding*2);
            
            canvasContainer.style.width = `${size}px`;
            canvasContainer.style.height = `${size}px`;
            
            // 디스플레이 화질(Retina 등)에 맞춰 픽셀 밀도 대응
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 초기화
            ctx.scale(dpr, dpr);
            
            // 기준 600px 화면 대비 현재 화면 크기의 비율 (스케일 팩터)
            sf = size / 600; 
            
            CENTER_X = size / 2;
            CENTER_Y = size / 2;
            
            // 비율에 맞춰 눈금 간격도 동적 증가
            OCU_SPACING = 8.5 * sf; 
            
            // 눈금 35(10~60의 중앙)가 렌즈 정중앙에 오도록 시작점 계산
            START_X = CENTER_X - (25 * OCU_SPACING);

            drawMicroscope();
        }

        function drawMicroscope() {
            // 배경 지우기 (원 크기는 size와 동일)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 중앙선
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(canvas.width / (window.devicePixelRatio||1), CENTER_Y);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1 * Math.max(1, sf);
            ctx.stroke();

            drawOcularMicrometer();
            if (currentStep === 1) {
                drawObjectiveMicrometer();
                drawOverlapArrows();
            }

            if (currentStep === 2) {
                drawCell();
            }
        }

        function drawOcularMicrometer() {
            ctx.fillStyle = '#065f46';
            ctx.strokeStyle = '#065f46';
            ctx.textAlign = 'center';
            ctx.font = `bold ${32 * sf}px Pretendard, sans-serif`;

            ctx.fillText("접안마이크로미터", CENTER_X, CENTER_Y - (120 * sf));

            // 0 ~ 100까지 그려서 렌즈 밖까지 꽉 차게 생성
            for (let actualVal = 0; actualVal <= 100; actualVal++) {
                const x = START_X + ((actualVal - 10) * OCU_SPACING);
                
                let height = 15 * sf;
                if (actualVal % 10 === 0) height = 30 * sf;
                else if (actualVal % 5 === 0) height = 20 * sf;

                ctx.beginPath();
                ctx.moveTo(x, CENTER_Y);
                ctx.lineTo(x, CENTER_Y - height);
                ctx.lineWidth = (actualVal % 10 === 0 ? 2 : 1) * Math.max(1, sf);
                ctx.stroke();

                if (actualVal % 10 === 0) {
                    ctx.fillText(actualVal, x, CENTER_Y - height - (8 * sf));
                }
            }
        }

        function drawObjectiveMicrometer() {
            const config = CONFIG[currentMag];
            const objSpacing = (config.ocuDiv * OCU_SPACING) / config.objDiv; 
            
            ctx.fillStyle = '#1f2937';
            ctx.strokeStyle = '#1f2937';
            ctx.textAlign = 'center';
            
            ctx.font = `bold ${32 * sf}px Pretendard, sans-serif`;
            ctx.fillText("대물마이크로미터", CENTER_X, CENTER_Y + (145 * sf));
            ctx.font = `bold ${16 * sf}px Pretendard, sans-serif`;
            ctx.fillText("(1눈금 = 10μm)", CENTER_X, CENTER_Y + (170 * sf));

            // -50 ~ 100까지 넓게 그리기
            for (let i = -50; i <= 100; i++) {
                const x = START_X + (i * objSpacing);
                
                let height = 25 * sf;
                if (i % 10 === 0) height = 45 * sf; 
                else if (i % 5 === 0) height = 35 * sf;

                ctx.beginPath();
                ctx.moveTo(x, CENTER_Y);
                ctx.lineTo(x, CENTER_Y + height);
                ctx.lineWidth = (i % 10 === 0 ? 2.5 : 1) * Math.max(1, sf);
                ctx.stroke();
            }
        }

        function drawOverlapArrows() {
            const config = CONFIG[currentMag];
            const arrow1X = START_X; // 접안 10 위치
            const arrow2X = START_X + (config.ocuDiv * OCU_SPACING);

            const drawArrow = (x, isTop) => {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                const y = isTop ? CENTER_Y - (55 * sf) : CENTER_Y + (65 * sf);
                const dir = isTop ? 1 : -1;
                // 화살표 촉
                ctx.moveTo(x, y);
                ctx.lineTo(x - (7 * sf), y + (13 * sf * dir));
                ctx.lineTo(x + (7 * sf), y + (13 * sf * dir));
                ctx.fill();
                
                // 점선 연결
                ctx.beginPath();
                ctx.moveTo(x, y + (13 * sf * dir));
                ctx.lineTo(x, CENTER_Y);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                ctx.lineWidth = 1.5 * Math.max(1, sf);
                ctx.setLineDash([4 * sf, 4 * sf]);
                ctx.stroke();
                ctx.setLineDash([]);
            };

            drawArrow(arrow1X, true);
            drawArrow(arrow1X, false);
            drawArrow(arrow2X, true);
            drawArrow(arrow2X, false);
            
            ctx.fillStyle = '#ef4444';
            ctx.font = `bold ${14 * sf}px Pretendard, sans-serif`;
            ctx.fillText("겹친 부분", arrow1X + (arrow2X - arrow1X)/2, CENTER_Y - (75 * sf));
            ctx.fillText("겹친 부분", arrow1X + (arrow2X - arrow1X)/2, CENTER_Y + (90 * sf));
        }

        function generateCell() {
            let minDiv = 10, maxDiv = 30;
            if (currentMag === 400) {
                cellDivisions = Math.floor(Math.random() * ((maxDiv - minDiv)/2)) * 2 + minDiv;
            } else {
                cellDivisions = Math.floor(Math.random() * (maxDiv - minDiv)) + minDiv;
            }
            document.getElementById('cell-div-text').innerText = cellDivisions;
            drawMicroscope();
        }

        function drawCell() {
            const cellWidthPx = cellDivisions * OCU_SPACING;
            // 세포를 접안 20 눈금 위치 쯤에 배치
            const startX = START_X + (10 * OCU_SPACING); 
            const endX = startX + cellWidthPx;
            const cellCenterY = CENTER_Y;
            const cellHeight = cellWidthPx * 0.7;
            
            // 세포 형태
            ctx.beginPath();
            ctx.ellipse(startX + cellWidthPx/2, cellCenterY, cellWidthPx/2, cellHeight/2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.4)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(37, 99, 235, 0.8)';
            ctx.lineWidth = 2 * Math.max(1, sf);
            ctx.stroke();

            // 핵
            ctx.beginPath();
            ctx.arc(startX + cellWidthPx/2 - (10 * sf), cellCenterY + (5 * sf), cellHeight/4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(30, 64, 175, 0.6)';
            ctx.fill();

            // 측정 안내선
            const lineY = cellCenterY + cellHeight/2 + (20 * sf);
            ctx.beginPath();
            // 수직 기둥
            ctx.moveTo(startX, lineY - (8 * sf)); ctx.lineTo(startX, lineY + (8 * sf));
            ctx.moveTo(endX, lineY - (8 * sf)); ctx.lineTo(endX, lineY + (8 * sf));
            // 수평선
            ctx.moveTo(startX, lineY); ctx.lineTo(endX, lineY);
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1.5 * Math.max(1, sf);
            ctx.stroke();
            
            // 화살표 촉
            ctx.fillStyle = '#374151';
            ctx.beginPath(); ctx.moveTo(startX, lineY); ctx.lineTo(startX+(7 * sf), lineY-(4 * sf)); ctx.lineTo(startX+(7 * sf), lineY+(4 * sf)); ctx.fill();
            ctx.beginPath(); ctx.moveTo(endX, lineY); ctx.lineTo(endX-(7 * sf), lineY-(4 * sf)); ctx.lineTo(endX-(7 * sf), lineY+(4 * sf)); ctx.fill();
        }

        function checkStep1() {
            const inObj = parseInt(document.getElementById('input-obj-div').value);
            const inOcu = parseInt(document.getElementById('input-ocu-div').value);
            const inLen = parseFloat(document.getElementById('input-ocu-len').value);
            
            const config = CONFIG[currentMag];
            const isRatioCorrect = (inObj && inOcu) && (inObj / inOcu === config.objDiv / config.ocuDiv);
            const isLenCorrect = inLen === config.ocuLen;

            if (isRatioCorrect && isLenCorrect) {
                showMessage(msgStep1, "정답입니다! 2단계로 넘어갑니다.", "text-blue-600");
                
                if (currentStep === 1) {
                    setTimeout(() => {
                        if (currentStep !== 1) return;
                        currentStep = 2;
                        panelStep2.classList.remove('hidden');
                        generateCell();
                        // 스크롤이 자동으로 2단계 창으로 내려가도록 함
                        panelStep2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 1000);
                }
            } else {
                if (!isRatioCorrect) {
                    showMessage(msgStep1, "틀렸습니다. 화면의 빨간 화살표가 가리키는 겹친 눈금 수를 다시 세어보세요.", "text-red-500");
                } else {
                    showMessage(msgStep1, `눈금 수는 맞았습니다! 접안 1눈금의 길이를 다시 계산해보세요. (힌트: 대물 ${inObj}칸 = ${inObj * 10}μm)`, "text-red-500");
                }
            }
        }

        function checkStep2() {
            const inSize = parseFloat(document.getElementById('input-cell-size').value);
            const actualSize = cellDivisions * CONFIG[currentMag].ocuLen;

            if (Math.abs(inSize - actualSize) < 0.05) {
                showMessage(msgStep2, "🎉 정답입니다! 완벽하게 세포 크기를 측정했습니다.", "text-green-600");
                document.getElementById('btn-reset').classList.remove('hidden');
                document.getElementById('btn-check-step2').classList.add('hidden');
            } else {
                showMessage(msgStep2, `틀렸습니다. (접안 눈금 ${cellDivisions}칸 × 1눈금 길이 ${CONFIG[currentMag].ocuLen}μm = ?)`, "text-red-500");
            }
        }

        function showMessage(el, text, colorClass) {
            el.textContent = text;
            el.className = `text-sm text-center mt-3 font-bold ${colorClass} block break-keep`;
        }
        function hideMessage(el) {
            el.classList.add('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
